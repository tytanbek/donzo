# DONZO — Render blueprint (bitta bepul web service, 24/7)
#
# Nega bitta xizmat? Render free tier 750 soat/oy — butun workspace uchun.
# Bitta konteyner 24/7 (744 soat) ishlaydi; cloud_launcher.py ichida
# daphne + bot + user_client ni nazorat qiladi va o'zini uyquga
# ketishdan saqlaydi (RENDER_EXTERNAL_URL ga 5 daqiqada ping).
#
# PostgreSQL → Neon (bepul, muddatsiz). Ulanish Render dashboard'da
# "Environment" bo'limiga yoziladi (quyidagi sync: false kalitlar).

services:
  - type: web
    name: donzo-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "false"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,donzo-backend.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://donzo-eight.vercel.app,https://frontend-self-mu-1nb1d09n0h.vercel.app,http://localhost:3000,http://localhost:3002"
      # ── Bot / Mini App. WEB_APP_URL is authoritative: cloud_launcher.py
      #    re-syncs it into the Settings DB (the bot reads that row per
      #    message), so a stale DB value can never send users to a wrong app. ──
      - key: WEB_APP_URL
        value: "https://donzo-eight.vercel.app"
      - key: TELEGRAM_BOT_USERNAME
        value: DONZOROBOT
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # ── Ops: /internal/diag/ (state, sync-urls, set, migrate) requires this
      #    header token. Leave the value in the dashboard, never in git. ──
      - key: DIAG_TOKEN
        sync: false
      # ── Gemini: all AI paths (staff AI, group AI, risk engine) need it. ──
      - key: GEMINI_API_KEY
        sync: false
      - key: DB_SSLMODE
        value: "require"
      - key: AUDIT_REPORT_HOUR
        value: "9"
      # ── Neon: bitta ulanish satri (Neon dashboard → Connect →
      #    postgresql://user:pass@host/dbname) ──
      - key: DATABASE_URL
        sync: false
      # ── Maxfiylar (lokal .env bilan BIR XIL bo'lishi shart) ──
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false
      # ── user_client uchun zaxira (DB settings'da ham bor) ──
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      # ── user_client sessiyasi (agar env orqali uzatilsa) ──
      - key: SESSION_B64
        sync: false
