name: Keep Alive — Backend

on:
  schedule:
    - cron: '*/7 * * * *'  # Har 7 daqiqada ping
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          for i in 1 2 3; do
            code=$(curl -sk --max-time 30 -o /dev/null -w "%{http_code}" "https://donzo-backend-v8oz.onrender.com/health/" 2>/dev/null)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is alive!"
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not respond — may need manual restart"
          exit 1
